name: Build and release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run tests/unit

      - name: UI tests
        run: npx vitest run tests/ui

      - name: Determine spec version
        id: spec
        run: |
          VERSION=$(grep -oP 'Status: v\K[0-9]+\.[0-9]+\.[0-9]+' docs/SPECIFICATION.md | head -1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The build version shown in the header is injected here, from the same
      # specification status line as the release tag.
      - name: Build production bundle
        env:
          MAPVIBES_VERSION: ${{ steps.spec.outputs.version }}
        run: npm run build

      - name: Check the build version in the built artifacts
        run: |
          for f in dist/build/index.html dist/build/mapvibes-singlefile.html; do
            grep -qF '"v${{ steps.spec.outputs.version }}"' "$f"
          done
      - name: Build regression tests (inlined artifacts)
        run: npx vitest run tests/inline-build

      # The interactive export round trip (FR-11, FR-14, FR-38, FR-39) runs
      # the built page in headless Chromium, offline.
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      # The desktop safety test (Pass 13) compares the layout of this build
      # with that of the released v1.3.1 build, in the same browser and with
      # the same fonts: the reference is built here from its tag, unchanged.
      - name: Build the v1.3.1 reference for the desktop safety test
        run: |
          git fetch --depth=1 origin tag v1.3.1
          git worktree add ../mapvibes-reference v1.3.1
          ln -s "$PWD/node_modules" ../mapvibes-reference/node_modules
          (cd ../mapvibes-reference && MAPVIBES_VERSION=1.3.1 npm run build)
          mkdir -p dist/reference
          cp -r ../mapvibes-reference/dist/build dist/reference/v1.3.1

      - name: Browser tests (exported file round trip, offline)
        run: npx vitest run tests/browser

      - name: Package release archive
        run: npx vite-node scripts/package-release.ts && (cd dist/release && zip -qr mapvibes.zip mapvibes)

      # GitHub Pages hosts the generic application build only: exactly the
      # files of the release archive, from this same build. Any other file
      # (user data, work states, exported presentations, extra data) stops
      # the deployment.
      - name: Check the Pages content against the release archive
        run: |
          cd dist/release/mapvibes
          expected="README.txt THIRD_PARTY_LICENSES.txt index.html mapvibes-singlefile.html"
          actual=$(find . -type f -printf '%P\n' | sort | tr '\n' ' ' | sed 's/ $//')
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected Pages content: $actual"
            exit 1
          fi
          cmp index.html ../../build/index.html
          cmp mapvibes-singlefile.html ../../build/mapvibes-singlefile.html
          sha256sum index.html mapvibes-singlefile.html

      - name: Upload the Pages artifact (the release archive content)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/release/mapvibes

      - name: Compute archive SHA-256
        id: sha
        run: echo "sha256=$(sha256sum dist/release/mapvibes.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # The release tag always names the commit that was built: when a release
      # is updated under an existing version, its tag is moved to this commit,
      # so that the tag, the archive, the hosted page, and the version shown
      # in the header all match.
      - name: Point the release tag at the built commit
        run: |
          git tag -f "v${{ steps.spec.outputs.version }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/v${{ steps.spec.outputs.version }}"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.spec.outputs.version }}
          name: MapVibes v${{ steps.spec.outputs.version }}
          draft: false
          prerelease: true
          files: dist/release/mapvibes.zip
          generate_release_notes: false
          body: |
            Runnable application archive for MapVibes v${{ steps.spec.outputs.version }}.

            SHA-256 of mapvibes.zip: `${{ steps.sha.outputs.sha256 }}`

            The archive contains the folder build (open index.html directly from a local folder, no server required) and a fully self-contained single-file build (mapvibes-singlefile.html). All assets are bundled; the application makes no network calls and works fully offline.

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
